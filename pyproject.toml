[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bcl2fastq-pipeline"
version = "0.3.1"
description = "GCF pipeline for demultiplexing and processing Illumina sequencing runs"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Geir Amund Svan Hasle", email = "geir.hasle@ntnu.no" },
]
dependencies = [
    "gcf-tools>=0.1",
    "pandas",
    "PyYAML",
    "urllib3",
]

[project.optional-dependencies]
dev = [
    "build",
    "pytest==9.1.1",
    "ruff==0.14.0",
]

[project.scripts]
bfq = "bcl2fastq_pipeline.entrypoint:main"
bfq-container = "bcl2fastq_pipeline.containers:main"
flowcell-manager = "flowcell_manager.flowcell_manager:main"

[tool.setuptools]
package-dir = { "" = "bcl2fastq_pipeline" }

[tool.setuptools.packages.find]
where = ["bcl2fastq_pipeline"]
include = ["bcl2fastq_pipeline*", "flowcell_manager*"]

[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4

# Exclude generated or data-heavy dirs
extend-exclude = [
    "files/",
    "__pycache__/",
    "*.egg-info",
    "build/",
    "dist/",
    "env/",
    "venv/",
]

[tool.ruff.lint]
# Rule groups to enable
select = ["E", "F", "I", "UP", "N", "W", "PL"]

# Ignore overly strict or irrelevant rules
ignore = [
    "E501",  # line too long (handled by formatter)
    "E203",  # whitespace before ':' (black compat)
    "E731",  # lambda assignment
    "PLR0912",  # too many branches
    "PLR0915",  # too many statements
    "PLR2004",  # magic numbers
    "N8",       # naming styles, too much to fix now
    "N999",     # allow CamelCase module names
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

[tool.ruff.lint.isort]
known-third-party = ["numpy", "pandas", "matplotlib", "yaml", "bioblend"]
combine-as-imports = true
force-single-line = false
lines-between-types = 1

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.ruff.lint.pep8-naming]
# Suppress variable-naming complaints for these known mixed-case identifiers
ignore-names = [
    "bfq_afq",
    "fm",
    "MKFASTQ_10X",
    "SEQUENCER_OUTPUTFOLDER",
    "CUSTOM_OPTS",
    "SEQUENCERS",
]
extend-ignore-names = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
