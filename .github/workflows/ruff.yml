name: Development checks

on:
  pull_request:
  push:
    branches: [ master, main, bfq-dev, staging ]

jobs:
  tests:
    name: Local checks and clean wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare isolated dependencies
        run: python3.11 scripts/dev.py setup
      - name: Run shared offline checks
        run: python3.11 scripts/dev.py check all
      - name: Retain check identity on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: development-check-identity
          path: |
            .dev/runs/*/identity.json
            .dev/runs/*/packages.txt
          if-no-files-found: ignore
